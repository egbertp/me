name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20" # Define the elixir version [required]
          otp-version: "29" # Define the OTP version [required]
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors --all-warnings
      - name: Check format
        run: mix format --check-formatted
      - name: Run credo
        run: mix credo
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - name: Deploy to VM
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" output/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:."
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
